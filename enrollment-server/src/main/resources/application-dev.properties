# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-module.xml

enrollment-server.identity-verification.enabled=true
enrollment-server.document-verification.provider=mock
enrollment-server.presence-check.provider=mock

enrollment-server.admin.enabled=true
enrollment-server.auth-type=BASIC_HTTP

spring.security.user.name=admin
# Override locally if you need a different development password.
spring.security.user.password=${ENROLLMENT_SERVER_DEV_SECURITY_USER_PASSWORD:{noop}changeit}

logging.level.com.wultra=DEBUG
logging.level.com.wultra.core.audit=INFO
